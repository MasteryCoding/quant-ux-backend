components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  parameters:
    AppId:
      name: appID
      in: path
      required: true
      description: Application ID
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        lastname:
          type: string
        role:
          type: string
          enum: ["user", "guest"]
        image:
          type: string
        about:
          type: string
        homepage:
          type: string
        status:
          type: string
        lastlogin:
          type: integer
          format: int64
        domain:
          type: string
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64
        token:
          type: string
          description: JWT token (only returned on login)

    App:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        isPublic:
          type: boolean
        clonable:
          type: boolean
        rating:
          type: number
          format: float
        test:
          type: integer
        comments:
          type: integer
        screenSize:
          type: object
          properties:
            w:
              type: integer
            h:
              type: integer
        users:
          type: object
          description: Map of userID to permission level
          additionalProperties:
            type: integer
            description: Permission level (higher number = higher permission)
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64
        isDeleted:
          type: boolean
        widgets:
          type: object
          description: App widgets structure
        screens:
          type: object
          description: App screens structure
        groups:
          type: object
          description: App groups structure
        templates:
          type: object
          description: App templates structure

    Library:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
        users:
          type: object
          description: Map of userID to permission level
          additionalProperties:
            type: integer
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    Comment:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        userID:
          type: string
        type:
          type: string
          example: "ScreenComment"
        reference:
          type: string
        parent:
          type: string
          description: Parent comment ID for threaded comments
        message:
          type: string
        annotation:
          type: string
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    Event:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        userID:
          type: string
        type:
          type: string
          example: "SessionStart"
        session:
          type: string
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    Image:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        userID:
          type: string
        name:
          type: string
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    Annotation:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        userID:
          type: string
        type:
          type: string
        reference:
          type: string
        value:
          type: string
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    CommandStack:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        stack:
          type: array
          items:
            $ref: '#/components/schemas/Command'
        pos:
          type: integer
          description: Current position in command stack
        lastUUID:
          type: integer

    Command:
      type: object
      description: Individual command in the undo/redo stack
      properties:
        userID:
          type: string
        type:
          type: string
        data:
          type: object

    TestSetting:
      type: object
      properties:
        _id:
          type: string
        appID:
          type: string
        userID:
          type: string
        tasks:
          type: array
          items:
            type: object
        created:
          type: integer
          format: int64
        lastUpdate:
          type: integer
          format: int64

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

